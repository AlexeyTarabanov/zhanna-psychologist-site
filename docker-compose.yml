services:
  zhanna-psycholog-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhanna-psycholog-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
